name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/1time-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/1time-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          short_sha="${GITHUB_SHA::12}"
          backend_tags="${BACKEND_IMAGE}:sha-${short_sha}"
          web_tags="${WEB_IMAGE}:sha-${short_sha}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            backend_tags="${backend_tags},${BACKEND_IMAGE}:${version},${BACKEND_IMAGE}:latest"
            web_tags="${web_tags},${WEB_IMAGE}:${version},${WEB_IMAGE}:latest"
          elif [[ "${GITHUB_REF}" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
            backend_tags="${backend_tags},${BACKEND_IMAGE}:${DEFAULT_BRANCH},${BACKEND_IMAGE}:latest"
            web_tags="${web_tags},${WEB_IMAGE}:${DEFAULT_BRANCH},${WEB_IMAGE}:latest"
          fi

          echo "tags_backend=${backend_tags}" >> "$GITHUB_OUTPUT"
          echo "tags_web=${web_tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags_backend }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags_web }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_HOSTNAME=1time.io
            SHOW_BLOG=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
